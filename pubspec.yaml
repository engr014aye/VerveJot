name: vervejot
description: "VerveJot – 100% Offline Daily Notes & Tasks organizer with fluid spring physics, tactile bounce interactions, and subtle audio feedback."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  sqflite: ^2.4.3
  path: ^1.9.1
  path_provider: ^2.1.6
  intl: ^0.20.3
  shared_preferences: ^2.5.5
  audioplayers: ^6.8.1
  share_plus: ^13.3.0
  url_launcher: ^6.3.1
  in_app_update: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/icons/
